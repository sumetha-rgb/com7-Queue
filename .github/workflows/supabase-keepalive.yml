name: Keep Supabase Alive

on:
  schedule:
    # รันทุกวันอาทิตย์และวันพุธ เวลา 00:00 UTC (07:00 น. เวลาไทย)
    - cron: '0 0 * * 0,3'
  workflow_dispatch: # กดรันเองได้

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/candidates?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP Status: $response"

          if [ "$response" != "200" ]; then
            echo "Ping failed or unexpected response: $response"
            exit 1
          fi

          echo "Ping successful! (Server responded with status $response)"
